name: Test install.sh (unit)

on:
  push:
    paths:
      - "install.sh"
      - "tests/test-install-unit.sh"
      - ".github/workflows/test-install-unit.yml"
  pull_request:
    paths:
      - "install.sh"
      - "tests/test-install-unit.sh"
      - ".github/workflows/test-install-unit.yml"
  workflow_dispatch: {}

jobs:
  unit-test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        # The suite sources install.sh directly and exercises its functions with
        # mocked network/services. Running on macOS catches BSD-toolchain
        # regressions (e.g. `wc -l` space-padding) that Linux CI would miss.
        run: bash tests/test-install-unit.sh
